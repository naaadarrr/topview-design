
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topview.design</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              heading: ['"Instrument Serif"', 'Georgia', 'serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- display=block avoids FOUT/flash when Instrument Serif swaps in on catalog -->
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500;600;700;800;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
    <style>
        :root {
            --topview-blue: #731DFB;
            --topview-purple: #731DFB;
            --bg-dark: #111111;
        }
        html, body, #root {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            margin: 0;
        }
        /* Beat Tailwind defaults + heading element rules for UI labels */
        .font-sans,
        h1.font-sans, h2.font-sans, h3.font-sans, h4.font-sans {
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif !important;
        }
        /* Content page titles + catalog/sidebar display face */
        h1:not(.font-sans), h2:not(.font-sans), h3:not(.font-sans), h4:not(.font-sans),
        .font-heading, .catalog-title {
            font-family: 'Instrument Serif', 'Times New Roman', Times, serif;
            font-synthesis: none;
        }
        .catalog-title {
            line-height: 1;
            font-weight: 400;
        }
        @keyframes catalogItemIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-catalog-item-in {
            animation-name: catalogItemIn;
            animation-duration: 600ms;
            animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
            animation-fill-mode: forwards;
        }
        /* Brand sans for typography system (titles specimen) */
        .font-darker {
            font-family: 'Darker Grotesque', sans-serif;
        }
        /* Legacy typefaces — kept for reference / migration */
        .font-outfit { font-family: 'Outfit', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .slide-up {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        ::selection {
            background-color: var(--topview-blue);
            color: white;
        }

        /* Enforce standard rounded corners */
        .rounded-brand { border-radius: 12px; }
        .rounded-brand-lg { border-radius: 24px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
